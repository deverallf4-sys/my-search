<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0">
    

    <style>
      html,
      body {
        margin:0;
        width: 100%;
        height: 100%;
        background: transparent !important;
      }

       body {
        display: flex;
        justify-context: center;
        align-items: center;
        font-family: Arial, sans-serif;
        gap:25px;
      } 
        
      .search {
        width: 500px;
        max-width: 80%;
        padding: 16px 22px;
        border: 2px solid #ff1493;
        border-radius: 30px;
        font-size: 18px;
        outline: none;
          /*typed words are WHITE*/
        background: #000000;
        color: #ffffff;

        /* Pink glow around the box */
        box-shadow:
        0 0 8px #ff1493
        0 0 20px  rgba(225, 20, 147, 0.6);
      }
      /*Placeholder stays pink*/
      .search::placeholder {
        color: #ff1493;
        opacity: 1;
      }
        text-shadow: 
        0 0 5px #ff1493'
       0 0 20px #ff1493;
      }
      
      .search:focus {
        border-color: #ff69b4;

        box-shadow:
          0 0 10px #ff1493,
          0 0 10px #ff1493,
          0 0 45px rgba(255, 20, 147, 0.5);
      }

      /*AI response text will be WHITE*/
      .ai-response {
        color: #ffffff;
        background: #000000;
      }
     </style>
  </head>
  <body>
    <input
    id="search"
    class="search"
    type="text"
    placeholder="Ask your question..."
autocomplete="on"
    autofocus
    >
<div id="response" class="ai-response"></div>
<script>
const search = document.getElementById("search");
const=response=
document.getElementById("response");
search.addEvemtlistener("keydown",async function event) {if (event.key !==enter") return;
const question = search.value.trim();
in(!question) return;
response.textContent = "thinking...";
try {
const result = await fetch ("/ask", {
method: "POST",
headers: {
"Content-Type": "application/json"},
body:JSON.stringify({
question: question});
const data =await result.json();
if (!result.ok) { throw new Error(data error|| "something went wrong.")}
response.textContent = data.answer;}
catch (error) { response.textContent = "I couldn't get a response. Make sure the AI is configured.";}});
</script>
  </body>
</html>
