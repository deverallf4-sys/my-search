<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0">
    <title>My Search</title>

    <style>
      body {
        margin:0;
        height:100vh; 
        display: flex;
        justify-context: center;
        align-items: center;
        backround: #000000;
        font-family: Arial, sans-serif;
      }
      .search {
        width: 500px;
        max-width: 80%;
        padding: 16px 22px;
        border: 2px solid #ff1493;
        border-radius: 30px;
        font-size: 18px;
        outline: none;
        /*typed words are WHITE*/
        background: #000000;
        color: #ffffff;

        /* Pink glow around the box */
        box-shadow:
        0 0 8px #ff1493
        0 0 20px  rgba(225, 20, 147, 0.6);
      }
      /*Placeholder stays pink*/
      .search::placeholder {
        color: #ffffff;
        opacity: 1;
        text-shadow: 
        0 0 5px #ff1493'
       0 0 20px #ff1493;
      }
      
      .search:focus {
        border-color: #ff69b4;

        box-shadow:
          0 0 10px #ff1493,
          0 0 10px #ff1493,
          0 0 45px rgba(255, 20, 147, 0.5);
      }

      /*AI response text will be WHITE*/
      .ai-response {
        color: #ffffff;
        background: transparent;
      }
     </style>
  </head>
  <body>
    <input 
    class="search"
    type="text"
    placeholder="Search..."
    autofocus
    >
  </body>
</html>
